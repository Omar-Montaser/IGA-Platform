[project]
name = "iga-connector"
version = "1.0.0"
description = "Module 3 - Linux discovery, normalization and approved remediation"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "paramiko>=3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
