name: Module 4 validation

on:
  push:
    paths:
      - "governance-platform/access-review/**"
      - "governance-platform/hr-policy/**"
      - ".github/workflows/module-4.yml"
  pull_request:
    paths:
      - "governance-platform/access-review/**"
      - "governance-platform/hr-policy/**"
      - ".github/workflows/module-4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Module 1 and Module 4
        run: |
          python -m pip install ./governance-platform/hr-policy
          python -m pip install ./governance-platform/access-review
      - name: Run Module 4 acceptance tests
        working-directory: governance-platform/access-review
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Confirm the installed CLI works outside the source tree
        working-directory: ${{ runner.temp }}
        run: iga-review --help
      - name: Build the distributable package
        working-directory: governance-platform/access-review
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
