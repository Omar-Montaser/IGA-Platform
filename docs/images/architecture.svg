<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title desc">
  <title id="title">IGA Platform architecture</title>
  <desc id="desc">Left to right: environment, connector, review backend and reviewer UI. The connector sends normalized access evidence to the backend. Findings reach the UI; human decisions return through the backend and connector for remediation and fresh-scan verification. HR and policy inputs, optional advisory AI and SQLite storage support the backend from below.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 650; fill: #f4f5f7; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .name { font-size: 24px; font-weight: 600; fill: #f1f3f7; }
      .body { font-size: 20px; fill: #bec5d1; }
      .label { font-size: 16px; fill: #b4bfce; }
      .wire { fill: none; stroke: #8c9aa9; stroke-width: 1.8; stroke-linejoin: round; }
      .return { fill: none; stroke: #d28b94; stroke-width: 1.8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8c9aa9" stroke-width="1.6"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d28b94" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1600" height="710" rx="18" fill="#111419"/>
  <rect x="48" y="43" width="5" height="36" rx="2" fill="#e15661"/>
  <text x="72" y="71" class="title">IGA Platform</text>
  <text x="1552" y="68" text-anchor="end" class="label">SYSTEM ARCHITECTURE</text>
  <path d="M48 108 H1552" stroke="#2b323d"/>

  <!-- Primary path: environment to reviewer. -->
  <rect x="48" y="168" width="240" height="280" rx="12" fill="#192b2a" stroke="#4c847c" stroke-width="1.5"/>
  <text x="72" y="206" class="tag" fill="#87cfc0">ENVIRONMENT</text>
  <g fill="none" stroke="#87cfc0" stroke-width="1.8"><rect x="72" y="241" width="48" height="24" rx="4"/><rect x="72" y="274" width="48" height="24" rx="4"/><path d="M81 253 H98 M81 286 H98"/><circle cx="110" cy="253" r="1.5"/><circle cx="110" cy="286" r="1.5"/></g>
  <text x="72" y="354" class="name">Linux IAM lab</text>
  <text x="72" y="389" class="body">Accounts &amp; grants</text>

  <rect x="380" y="168" width="250" height="280" rx="12" fill="#202735" stroke="#58769e" stroke-width="1.5"/>
  <text x="404" y="206" class="tag" fill="#9dbbe4">CONNECTOR</text>
  <g fill="none" stroke="#9dbbe4" stroke-width="1.8"><path d="M418 241 V258 M439 241 V258 M408 258 H449 V270 Q449 291 429 291 Q408 291 408 270 Z M429 291 V307"/></g>
  <text x="404" y="354" class="name">Scan &amp; normalize</text>
  <text x="404" y="389" class="body">Apply changes</text>

  <rect x="725" y="168" width="450" height="280" rx="12" fill="#2b1e25" stroke="#a35b68" stroke-width="1.5"/>
  <text x="749" y="206" class="tag" fill="#efa0ac">REVIEW BACKEND</text>
  <rect x="749" y="235" width="402" height="52" rx="7" fill="#1d1920" stroke="#59414d"/>
  <text x="950" y="269" text-anchor="middle" class="name">Campaign runs</text>
  <rect x="749" y="301" width="402" height="52" rx="7" fill="#1d1920" stroke="#59414d"/>
  <text x="950" y="335" text-anchor="middle" class="name">Policy review</text>
  <rect x="749" y="367" width="402" height="52" rx="7" fill="#1d1920" stroke="#59414d"/>
  <text x="950" y="401" text-anchor="middle" class="name">Verified remediation</text>

  <rect x="1268" y="168" width="284" height="280" rx="12" fill="#25272d" stroke="#747c8c" stroke-width="1.5"/>
  <text x="1292" y="206" class="tag" fill="#cbd1dc">REVIEWER UI</text>
  <g fill="none" stroke="#b3bccb" stroke-width="1.8"><rect x="1292" y="241" width="68" height="48" rx="4"/><path d="M1292 253 H1360 M1302 264 H1315 V280 H1302 Z M1324 266 H1350 M1324 276 H1345"/></g>
  <text x="1292" y="354" class="name">Findings &amp; evidence</text>
  <text x="1292" y="389" class="body">Human decisions</text>

  <!-- Evidence flows right; approved actions return left. -->
  <path d="M288 282 H380" class="wire" marker-end="url(#arrow)"/><text x="334" y="263" text-anchor="middle" class="label">Access</text>
  <path d="M630 282 H725" class="wire" marker-end="url(#arrow)"/><text x="678" y="263" text-anchor="middle" class="label">Evidence</text>
  <path d="M1175 282 H1268" class="wire" marker-end="url(#arrow)"/><text x="1222" y="263" text-anchor="middle" class="label">Findings</text>
  <path d="M380 370 H288" class="return" marker-end="url(#red)"/><text x="334" y="400" text-anchor="middle" class="label">Changes</text>
  <path d="M725 370 H630" class="return" marker-end="url(#red)"/><text x="678" y="400" text-anchor="middle" class="label">Revoke</text>
  <path d="M1268 370 H1175" class="return" marker-end="url(#red)"/><text x="1222" y="400" text-anchor="middle" class="label">Decisions</text>

  <!-- Supporting services. -->
  <path d="M675 566 V505 H790 V448" class="wire" marker-end="url(#arrow)"/>
  <path d="M1030 566 V505 H950 V448" class="wire" stroke-dasharray="6 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M1391 566 V490 H1110 V448" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="520" y="566" width="310" height="96" rx="12" fill="#29261d" stroke="#897a4e" stroke-width="1.5"/>
  <text x="675" y="607" text-anchor="middle" class="name">HR &amp; policies</text>
  <text x="675" y="636" text-anchor="middle" class="label">Identity context</text>
  <rect x="870" y="566" width="320" height="96" rx="12" fill="#261f32" stroke="#8666a0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1030" y="607" text-anchor="middle" class="name">AI review</text>
  <text x="1030" y="636" text-anchor="middle" class="label">Optional · Advisory</text>
  <rect x="1230" y="566" width="322" height="96" rx="12" fill="#1e2922" stroke="#5c8167" stroke-width="1.5"/>
  <text x="1391" y="607" text-anchor="middle" class="name">SQLite</text>
  <text x="1391" y="636" text-anchor="middle" class="label">Evidence &amp; audit</text>
</svg>
